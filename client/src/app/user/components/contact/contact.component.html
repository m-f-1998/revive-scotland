<div class="grid grid-cols-1 lg:grid-cols-2" id="contact">
  <div class="half-page-banner min-h-[20rem] lg:min-h-0">
    <img src="/api/img/contact.jpg?w=640&f=webp"
      srcset="
        /api/img/contact.jpg?w=320&f=webp 320w,
        /api/img/contact.jpg?w=640&f=webp 640w,
        /api/img/contact.jpg?w=1024&f=webp 1024w
      "
      sizes="(max-width: 600px) 100vw, 600px"
      alt="Contact Us Banner"
      loading="lazy"
      decoding="async"
      class="w-full h-full object-cover block object-top"
    />
  </div>
  <div class="p-10 flex flex-col justify-center lg:border-l border-gray-200">
    <header class="mb-6">
      <p class="text-serif mb-0 text-primary">Contact Us</p>
      <h2 class="uppercase tracking-wider mb-2">Reach Out</h2>
      <p class="text-muted text-sm">If you have any questions, we would love to hear from you.</p>
    </header>

    <div class="grid gap-4">
      <button
        type="button"
        class="group flex items-center gap-4 p-4 rounded-xl bg-primary/5 dark:bg-primary/10 border border-primary/20 hover:border-primary/40 hover:bg-primary/10 transition-all text-left w-full"
        (click)="openMessageForm()"
        [disabled]="sending()">
        <div class="w-10 h-10 rounded-full bg-primary/15 text-primary flex items-center justify-center flex-shrink-0 group-hover:scale-110 transition-transform">
          @if (sending()) {
            <app-icon icon="spinner" iconAnimation="spin" />
          } @else {
            <app-icon icon="envelope" />
          }
        </div>
        <div class="flex-1">
          <span class="block text-sm text-zinc-500 font-semibold uppercase tracking-wider mb-0.5">Message</span>
          <span class="block font-medium text-zinc-800 dark:text-zinc-200">
            Send a quick message
          </span>
        </div>
      </button>

      <a class="group flex items-center gap-4 p-4 rounded-xl bg-zinc-50 dark:bg-zinc-800/50 border border-zinc-100 dark:border-zinc-800 hover:border-blue-200 dark:hover:border-blue-800 hover:bg-blue-50/50 dark:hover:bg-blue-900/10 transition-all text-left" [href]="'tel:' + details().phone">
        <div class="w-10 h-10 rounded-full bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 flex items-center justify-center flex-shrink-0 group-hover:scale-110 transition-transform">
          <app-icon icon="phone" />
        </div>
        <div class="flex-1">
          <span class="block text-sm text-zinc-500 font-semibold uppercase tracking-wider mb-0.5">Phone</span>
          <span class="block font-medium text-zinc-800 dark:text-zinc-200 group-hover:text-blue-700 dark:group-hover:text-blue-400 transition-colors">
            {{ details().phone }}
          </span>
        </div>
      </a>

      <a class="group flex items-center gap-4 p-4 rounded-xl bg-zinc-50 dark:bg-zinc-800/50 border border-zinc-100 dark:border-zinc-800 hover:border-blue-200 dark:hover:border-blue-800 hover:bg-blue-50/50 dark:hover:bg-blue-900/10 transition-all text-left" [href]="'mailto:' + details().email">
        <div class="w-10 h-10 rounded-full bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 flex items-center justify-center flex-shrink-0 group-hover:scale-110 transition-transform">
          <app-icon icon="envelope" />
        </div>
        <div class="flex-1">
          <span class="block text-sm text-zinc-500 font-semibold uppercase tracking-wider mb-0.5">Email</span>
          <span class="block font-medium text-zinc-800 dark:text-zinc-200 group-hover:text-blue-700 dark:group-hover:text-blue-400 transition-colors break-all">
            {{ details().email }}
          </span>
        </div>
      </a>

      <a class="group flex items-center gap-4 p-4 rounded-xl bg-zinc-50 dark:bg-zinc-800/50 border border-zinc-100 dark:border-zinc-800 hover:border-pink-200 dark:hover:border-pink-800 hover:bg-pink-50/50 dark:hover:bg-pink-900/10 transition-all text-left" [href]="'https://www.instagram.com/' + details().instagram" target="_blank" rel="noopener noreferrer">
        <div class="w-10 h-10 rounded-full bg-pink-100 dark:bg-pink-900/30 text-pink-600 dark:text-pink-400 flex items-center justify-center flex-shrink-0 group-hover:scale-110 transition-transform">
          <app-icon icon="instagram" />
        </div>
        <div class="flex-1">
          <span class="block text-sm text-zinc-500 font-semibold uppercase tracking-wider mb-0.5">Instagram</span>
          <span class="block font-medium text-zinc-800 dark:text-zinc-200 group-hover:text-pink-700 dark:group-hover:text-pink-400 transition-colors">
            &#64;{{ details().instagram }}
          </span>
        </div>
      </a>
    </div>
  </div>
</div>
