<div class="bg-white dark:bg-slate-900 rounded-xl overflow-hidden shadow-2xl max-w-lg w-full flex flex-col mx-auto my-8">
  <div class="px-6 py-8 text-center relative overflow-hidden"
       [class.bg-red-600]="type() === 'error'"
       [class.dark:bg-red-700]="type() === 'error'"
       [class.bg-amber-500]="type() === 'warning'"
       [class.dark:bg-amber-600]="type() === 'warning'">
    <!-- Decorative background elements -->
    <div class="absolute -top-10 -right-10 w-32 h-32 rounded-full blur-xl"
         [class.bg-red-500/30]="type() === 'error'"
         [class.bg-amber-400/30]="type() === 'warning'"></div>
    <div class="absolute -bottom-10 -left-10 w-32 h-32 rounded-full blur-xl"
         [class.bg-red-500/30]="type() === 'error'"
         [class.bg-amber-400/30]="type() === 'warning'"></div>

    <div class="relative z-10">
      <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
        @if (type() === 'error') {
          <app-icon icon="circle-xmark" class="text-red-600" iconSize="2x" />
        } @else if (type() === 'warning') {
          <app-icon icon="triangle-exclamation" class="text-amber-500" iconSize="2x" />
        }
      </div>
      <h2 class="text-2xl font-bold text-white mb-2">{{ title() }}</h2>
    </div>
  </div>

  <div class="p-6 md:p-8 flex-1 space-y-6">
    <div class="text-center space-y-3">
      <p class="text-zinc-600 dark:text-zinc-300">
        {{ message() }}
      </p>
    </div>

    <div class="bg-zinc-50 dark:bg-slate-800/50 rounded-xl p-5 border border-zinc-100 dark:border-slate-700/50">
      <h3 class="font-semibold text-zinc-900 dark:text-white mb-4 flex items-center gap-2 text-sm uppercase tracking-wider">
        <app-icon icon="info-circle" class="text-blue-500" /> Need Support?
      </h3>
      
      <div class="space-y-4">
        <a href="mailto:luca@revivescotland.co.uk" class="flex items-center gap-3 text-zinc-700 dark:text-zinc-300 hover:text-blue-600 dark:hover:text-blue-400 transition-colors group">
          <div class="w-10 h-10 rounded-full bg-white dark:bg-slate-800 flex items-center justify-center shadow-sm border border-zinc-200 dark:border-slate-700 group-hover:border-blue-300 dark:group-hover:border-blue-700">
            <app-icon icon="envelope" class="text-zinc-500 group-hover:text-blue-500" />
          </div>
          <div>
            <div class="text-xs text-zinc-500 dark:text-zinc-400 mb-0.5">Email us at</div>
            <div class="font-medium">luca&#64;revivescotland.co.uk</div>
          </div>
        </a>

        <a href="tel:+447883824055" class="flex items-center gap-3 text-zinc-700 dark:text-zinc-300 hover:text-blue-600 dark:hover:text-blue-400 transition-colors group">
          <div class="w-10 h-10 rounded-full bg-white dark:bg-slate-800 flex items-center justify-center shadow-sm border border-zinc-200 dark:border-slate-700 group-hover:border-blue-300 dark:group-hover:border-blue-700">
            <app-icon icon="phone" class="text-zinc-500 group-hover:text-blue-500" />
          </div>
          <div>
            <div class="text-xs text-zinc-500 dark:text-zinc-400 mb-0.5">Call us on</div>
            <div class="font-medium">+44 7883 824055</div>
          </div>
        </a>

        <a href="https://wa.me/447883824055" target="_blank" rel="noopener noreferrer" class="flex items-center gap-3 text-zinc-700 dark:text-zinc-300 hover:text-green-600 dark:hover:text-green-400 transition-colors group">
          <div class="w-10 h-10 rounded-full bg-white dark:bg-slate-800 flex items-center justify-center shadow-sm border border-zinc-200 dark:border-slate-700 group-hover:border-green-300 dark:group-hover:border-green-700">
            <app-icon icon="comments" class="text-zinc-500 group-hover:text-green-500" />
          </div>
          <div>
            <div class="text-xs text-zinc-500 dark:text-zinc-400 mb-0.5">Message us on WhatsApp</div>
            <div class="font-medium">+44 7883 824055</div>
          </div>
        </a>
      </div>
    </div>
  </div>

  <div class="p-6 pt-0 mt-auto">
    <button type="button" class="w-full btn-primary py-3 rounded-xl font-bold shadow-sm" (click)="close()">
      Close & Continue
    </button>
  </div>
</div>
