<input
  type="date"
  [id]="id"
  [value]="nativeValue()"
  [min]="minDateAttr"
  [max]="maxDateAttr"
  [disabled]="field.props?.readonly || false"
  [required]="props.required || false"
  (change)="onNativeChange($event)"
  class="form-control"
  [class.is-invalid]="formControl.invalid && (formControl.touched || formControl.dirty)"
/>
