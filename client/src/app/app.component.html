<div class="flex flex-col min-h-screen">
  <router-outlet></router-outlet>
  @if (authSvc.adminAccessInProgress()) {
    <div class="fixed inset-0 z-[9999] flex flex-col items-center justify-center gap-3 bg-black/40 backdrop-blur-sm">
      <app-icon icon="spinner" iconAnimation="spin" iconSize="3x" class="text-white" />
      <p class="text-white text-sm font-medium">Signing in to admin…</p>
    </div>
  }
  <a class="scroll-top" id="scrollTop" (click)="scrollToTop()">
    <app-icon icon="arrow-up-long" />
  </a>
</div>
