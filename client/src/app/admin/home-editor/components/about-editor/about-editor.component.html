<div class="card-header bg-gray-50 dark:bg-slate-800/80 border-b border-gray-200 dark:border-slate-700/80 px-5 py-4">
  <h5 class="mb-0 font-semibold flex items-center gap-2 text-primary dark:text-white text-base">
    <app-icon icon="info-circle" /> About Us Cards
  </h5>
</div>
<div class="card-body p-5 flex-1 space-y-4">
  @if (loading()) {
    <div class="flex flex-col items-center justify-center gap-3 py-10 text-gray-500 dark:text-gray-400">
      <app-icon icon="spinner" iconAnimation="spin" iconSize="2x" class="text-primary" />
      <p class="text-sm font-medium">Loading...</p>
    </div>
  } @else {
    <p class="text-gray-500 dark:text-gray-400 text-sm">Edit the short informational cards displayed in the "Who Are We?" section.</p>

    <div class="flex flex-wrap gap-2 mb-6 pb-4 border-b border-gray-100 dark:border-slate-700/50">
      @for (card of cards(); track $index) {
        <button type="button"
          class="px-4 py-2 text-xs font-semibold rounded-lg transition-all duration-200 flex items-center gap-2 border cursor-pointer"
          [class.bg-primary]="activeIndex() === $index"
          [class.text-white]="activeIndex() === $index"
          [class.shadow-sm]="activeIndex() === $index"
          [class.shadow-primary/20]="activeIndex() === $index"
          [class.border-primary]="activeIndex() === $index"
          [class.bg-gray-50]="activeIndex() !== $index"
          [class.text-gray-600]="activeIndex() !== $index"
          [class.dark:bg-slate-900]="activeIndex() !== $index"
          [class.dark:text-gray-300]="activeIndex() !== $index"
          [class.border-gray-200]="activeIndex() !== $index"
          [class.dark:border-slate-700]="activeIndex() !== $index"
          (click)="activeIndex.set($index)">
          <app-icon [icon]="card.icon || 'info-circle'" class="w-3.5 h-3.5" />
          <span>{{ card.title || 'Card ' + ($index + 1) }}</span>
        </button>
      }
    </div>

    @if (cards()[activeIndex()]; as card) {
      <div class="border border-gray-100 dark:border-slate-700/50 rounded-xl p-5 bg-white dark:bg-slate-800 shadow-xs transition-all duration-300 space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1.5">Icon</label>
          <app-icon-picker [value]="card.icon" (valueChange)="updateCard(activeIndex(), 'icon', $event)" />
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1.5">Title</label>
          <input type="text" maxlength="100" class="w-full border border-gray-300 dark:border-slate-600 rounded px-3 py-2 text-sm bg-white dark:bg-slate-900 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary transition-shadow"
            [value]="card.title" (input)="updateCard(activeIndex(), 'title', $any($event.target).value)" />
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1.5">Description</label>
          <textarea rows="4" maxlength="500" class="w-full border border-gray-300 dark:border-slate-600 rounded px-3 py-2 text-sm bg-white dark:bg-slate-900 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary resize-y transition-shadow"
            [value]="card.description" (input)="updateCard(activeIndex(), 'description', $any($event.target).value)"></textarea>
        </div>
      </div>
    }
  }
</div>
<div class="card-footer flex justify-between items-center bg-gray-50 dark:bg-slate-800 border-t border-gray-200 dark:border-slate-700 px-5 py-4">
  <button class="btn-outline-secondary btn-sm" (click)="restoreDefaults()" title="Reset to built-in defaults" [disabled]="loading()">
    <app-icon icon="refresh" /> Restore Defaults
  </button>
  <button class="btn-primary" [disabled]="saving() || !isDirty() || loading()" (click)="save()">
    @if (saving()) {
      <app-icon icon="spinner" iconAnimation="spin" />
    } @else {
      <app-icon icon="save" />
    }
    Save Changes
  </button>
</div>
