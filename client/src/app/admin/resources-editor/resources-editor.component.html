<div class="flex flex-col min-h-screen">
<app-admin-navbar />
<div class="flex-1 w-full max-w-screen-xl mx-auto p-4 md:p-8">

  <h2 class="text-2xl font-bold mb-2 flex items-center gap-2">
    <app-icon icon="praying-hands" />
    Liturgical Resources
  </h2>
  <p class="text-gray-500 text-sm mb-4">Manage prayers and video reflections shown on the public Liturgy page.</p>
  <hr class="border-gray-200 mb-6">

  @if (loading()) {
    <div class="flex flex-col items-center justify-center gap-2 p-10 text-gray-500">
      <app-icon icon="spinner" iconAnimation="spin" iconSize="2x" />
      <p class="mt-2">Loading...</p>
    </div>
  } @else {
    <app-prayers-editor 
      [prayers]="prayers()" 
      [saving]="savingPrayers()"
      (prayersChange)="onPrayersChange($event)"
      (save)="savePrayers()">
    </app-prayers-editor>

    <app-reflections-editor 
      [reflections]="reflections()" 
      [saving]="savingReflections()"
      (reflectionsChange)="onReflectionsChange($event)"
      (save)="saveReflections()">
    </app-reflections-editor>
  }
</div>
<app-admin-footer />
</div>
