<div class="card-header bg-gray-50 dark:bg-slate-800/80 border-b border-gray-200 dark:border-slate-700/80 px-5 py-4">
  <h5 class="mb-0 font-semibold flex items-center gap-2 text-primary dark:text-white text-base">
    <app-icon icon="praying-hands" /> Prayers
  </h5>
</div>

<div class="card-body p-5 flex-1 space-y-4">
  <p class="text-sm text-gray-500 dark:text-gray-400">
    Manage the standard prayers available on the resources page. Each prayer must have a title, category, type, and text content.
  </p>

  @for (prayer of prayers; track prayer.id; let i = $index) {
    <div class="border border-gray-100 dark:border-slate-700/50 rounded-xl bg-white dark:bg-slate-800 shadow-xs transition-all duration-300 overflow-hidden mb-3">
      <div class="flex items-center justify-between p-4 cursor-pointer select-none bg-gray-50/50 dark:bg-slate-800/50 hover:bg-gray-50 dark:hover:bg-slate-700/30 transition-colors" (click)="togglePrayer(i)">
        <div class="flex items-center gap-2 font-medium text-sm text-gray-800 dark:text-gray-200">
          <span class="inline-block transition-transform duration-200 text-gray-400" [class.rotate-180]="expandedPrayer() === i">
            <app-icon icon="chevron-down" />
          </span>
          {{ prayer.name || 'New Prayer' }}
        </div>
        <div class="flex items-center gap-1.5">
          <button class="btn-outline-secondary btn-sm p-1.5" [disabled]="i === 0" (click)="$event.stopPropagation(); movePrayerUp(i)" title="Move Up">
            <app-icon icon="chevron-up" class="w-3.5 h-3.5 flex items-center justify-center" />
          </button>
          <button class="btn-outline-secondary btn-sm p-1.5" [disabled]="i === prayers.length - 1" (click)="$event.stopPropagation(); movePrayerDown(i)" title="Move Down">
            <app-icon icon="chevron-down" class="w-3.5 h-3.5 flex items-center justify-center" />
          </button>
          <button class="btn-danger btn-sm p-1.5" (click)="$event.stopPropagation(); removePrayer(i)" title="Remove">
            <app-icon icon="trash" class="w-3.5 h-3.5 flex items-center justify-center" />
          </button>
        </div>
      </div>

      @if (expandedPrayer() === i) {
        <div class="p-5 border-t border-gray-100 dark:border-slate-700/50 space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1.5">Title <span class="text-red-500">*</span></label>
              <input type="text" class="w-full border border-gray-300 dark:border-slate-600 rounded px-3 py-2 text-sm bg-white dark:bg-slate-900 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary transition-shadow" [ngModel]="prayer.name" (ngModelChange)="updatePrayer(i, 'name', $event)" placeholder="e.g. Our Father">
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1.5">Internal ID <span class="text-gray-400 font-normal">(auto-generated)</span></label>
              <input type="text" class="w-full border border-gray-300 dark:border-slate-600 rounded px-3 py-2 text-sm bg-gray-100 dark:bg-slate-800 text-gray-500 cursor-not-allowed" [ngModel]="prayer.id" disabled>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1.5">Category <span class="text-red-500">*</span></label>
              <select class="w-full border border-gray-300 dark:border-slate-600 rounded px-3 py-2 text-sm bg-white dark:bg-slate-900 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary transition-shadow" [ngModel]="prayer.category" (ngModelChange)="updatePrayer(i, 'category', $event)">
                @for (cat of categories; track cat.value) {
                  <option [value]="cat.value">{{ cat.label }}</option>
                }
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1.5">Prayer Type <span class="text-red-500">*</span></label>
              <select class="w-full border border-gray-300 dark:border-slate-600 rounded px-3 py-2 text-sm bg-white dark:bg-slate-900 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary transition-shadow" [ngModel]="prayer.type" (ngModelChange)="updatePrayer(i, 'type', $event)">
                @for (t of prayerTypes; track t.value) {
                  <option [value]="t.value">{{ t.label }}</option>
                }
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1.5">Prayer Text <span class="text-red-500">*</span></label>
            <textarea class="w-full border border-gray-300 dark:border-slate-600 rounded px-3 py-2 text-sm bg-white dark:bg-slate-900 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary resize-y font-serif transition-shadow" rows="6" [ngModel]="prayer.text" (ngModelChange)="updatePrayer(i, 'text', $event)" placeholder="Enter the prayer text here..."></textarea>
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-1.5">Latin Translation <span class="text-gray-400 font-normal">(optional)</span></label>
            <textarea class="w-full border border-gray-300 dark:border-slate-600 rounded px-3 py-2 text-sm bg-white dark:bg-slate-900 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary resize-y font-serif transition-shadow" rows="4" [ngModel]="prayer.latin" (ngModelChange)="updatePrayer(i, 'latin', $event)" placeholder="Enter the traditional Latin translation if applicable..."></textarea>
          </div>
        </div>
      }
    </div>
  }

  <div class="pt-2">
    <button type="button" class="px-4 py-2.5 text-sm font-semibold rounded-lg text-primary hover:bg-primary/5 dark:hover:bg-primary/10 border border-dashed border-primary/30 flex items-center justify-center gap-2 w-full transition-all cursor-pointer" (click)="addPrayer()">
      <app-icon icon="plus-circle" /> Add New Prayer
    </button>
  </div>
</div>

<div class="card-footer flex justify-between items-center bg-gray-50 dark:bg-slate-800 border-t border-gray-200 dark:border-slate-700 px-5 py-4">
  <button class="btn-outline-secondary btn-sm" (click)="restoreDefaultPrayers()" title="Reset to built-in defaults">
    <app-icon icon="refresh" /> Restore Defaults
  </button>
  <button class="btn-primary" [disabled]="saving || prayersSomeEmpty()" (click)="save.emit()">
    @if (saving) {
      <app-icon icon="spinner" iconAnimation="spin" />
    } @else {
      <app-icon icon="save" />
    }
    Save Changes
  </button>
</div>
  `,
